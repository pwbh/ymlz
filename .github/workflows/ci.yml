name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build-and-test:
    strategy:
      matrix:
        zig-version:
          #- "0.14.1" fails with current version
          - "0.15.1"
          - "0.15.2"
          - "0.16.0"
    name: Build & Test (Zig ${{ matrix.zig-version }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        run: |
          wget https://ziglang.org/download/${{ matrix.zig-version }}/zig-x86_64-linux-${{ matrix.zig-version }}.tar.xz
          tar xf zig-x86_64-linux-${{ matrix.zig-version }}.tar.xz
          echo "$GITHUB_WORKSPACE/zig-x86_64-linux-${{ matrix.zig-version }}" >> "$GITHUB_PATH"
      - name: Build & Test
        run: zig build test run
